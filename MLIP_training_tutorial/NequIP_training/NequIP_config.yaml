run: [train, val]

data:
  _target_: nequip.data.datamodule.ASEDataModule
  seed: 123
  split_dataset:
    file_path: training_dataset/merged_for_nequip.xyz
    train: 0.8            # 80% training
    val: 0.2              # 20% validation (random split)
  key_mapping:
    REF_energy: total_energy   # map extxyz keys to NequIP fields
    REF_forces: forces
  transforms:
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      model_type_names: [C, Hg]
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: 6.0          # cutoff radius (Angstrom)
  stats_manager:
    _target_: nequip.data.CommonDataStatisticsManager
    type_names: [C, Hg]

training_module:
  _target_: nequip.train.EMALightningModule
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.01              # learning rate
  model:
    _target_: nequip.model.NequIPGNNModel
    seed: 123
    model_dtype: float32
    type_names: [C, Hg]
    r_max: 6.0
    avg_num_neighbors: ${training_data_stats:num_neighbors_mean}   # auto from data
    per_type_energy_shifts:      # isolated-atom reference energies (eV)
      C: -241.907386
      Hg: -10952.046782
    per_type_energy_scales:
      C: 1.0
      Hg: 1.0
  loss:
    _target_: nequip.train.EnergyForceLoss
    coeffs:
      total_energy: 50.0   # energy weight
      forces: 50.0        # force weight
  val_metrics:
    _target_: nequip.train.EnergyForceMetrics
    coeffs:
      per_atom_energy_rmse: 1.0   # aligned with per-atom loss
      forces_rmse: 1.0

trainer:
  _target_: lightning.Trainer
  accelerator: gpu
  max_epochs: 2000
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: val0_epoch/weighted_sum   # combined metric to rank checkpoints
      mode: min
      save_top_k: 1                       # keep only the best checkpoint
      save_last: true                     # also keep last.ckpt for resuming
      filename: best
      auto_insert_metric_name: false

    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val0_epoch/weighted_sum
      mode: min
      patience: 30                        # stop after 30 non-improving epochs
      min_delta: 1e-4