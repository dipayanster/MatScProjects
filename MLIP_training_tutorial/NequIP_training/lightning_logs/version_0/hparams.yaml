model:
  _target_: nequip.model.NequIPGNNModel
  seed: 123
  model_dtype: float32
  type_names:
  - C
  - Hg
  r_max: 6.0
  avg_num_neighbors: 40.040485829959515
  per_type_energy_shifts:
    C: -241.907386
    Hg: -10952.046782
  per_type_energy_scales:
    C: 1.0
    Hg: 1.0
num_datasets:
  train: 1
  val: 1
  test: 0
  predict: 0
optimizer:
  _target_: torch.optim.Adam
  lr: 0.01
lr_scheduler: null
loss:
  _target_: nequip.train.EnergyForceLoss
  coeffs:
    total_energy: 50.0
    forces: 50.0
train_metrics: null
val_metrics:
  _target_: nequip.train.EnergyForceMetrics
  coeffs:
    per_atom_energy_rmse: 1.0
    forces_rmse: 1.0
test_metrics: null
info_dict:
  versions:
    torch: 2.14.1+cu126
    e3nn: 0.6.0
    nequip: 0.19.1
  data:
    _target_: nequip.data.datamodule.ASEDataModule
    seed: 123
    split_dataset:
      file_path: training_dataset/merged_for_nequip.xyz
      train: 0.8
      val: 0.2
    key_mapping:
      REF_energy: total_energy
      REF_forces: forces
    transforms:
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      model_type_names:
      - C
      - Hg
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: 6.0
    stats_manager:
      _target_: nequip.data.CommonDataStatisticsManager
      type_names:
      - C
      - Hg
  trainer:
    _target_: lightning.Trainer
    accelerator: gpu
    max_epochs: 2000
    callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: val0_epoch/weighted_sum
      mode: min
      save_top_k: 1
      save_last: true
      filename: best
      auto_insert_metric_name: false
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val0_epoch/weighted_sum
      mode: min
      patience: 30
      min_delta: 0.0001
  global_options:
    allow_tf32: false
  runs:
  - train
  - val
  training_module:
    _target_: nequip.train.EMALightningModule
    optimizer:
      _target_: torch.optim.Adam
      lr: 0.01
    model:
      _target_: nequip.model.NequIPGNNModel
      seed: 123
      model_dtype: float32
      type_names:
      - C
      - Hg
      r_max: 6.0
      avg_num_neighbors: 40.040485829959515
      per_type_energy_shifts:
        C: -241.907386
        Hg: -10952.046782
      per_type_energy_scales:
        C: 1.0
        Hg: 1.0
    loss:
      _target_: nequip.train.EnergyForceLoss
      coeffs:
        total_energy: 50.0
        forces: 50.0
    val_metrics:
      _target_: nequip.train.EnergyForceMetrics
      coeffs:
        per_atom_energy_rmse: 1.0
        forces_rmse: 1.0
ema_decay: 0.999
